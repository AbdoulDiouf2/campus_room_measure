# CONTEXTE ÉTUDIANT : S1-S2 | lancer depuis la racine du dépôt étudiant
# À PRÉPARER / ADAPTER : Générer .env ; conserver le port DB accessible seulement sur la loopback.
# CONTRÔLE ATTENDU : API locale vers campus ; terminal de tests séparé vers campus_test.
#
# S1-S2 uniquement : DB et reverse proxy conteneurisés, API exécutée sur le poste.
name: campusdata-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    # L’API tourne sur le poste : accès DB par 127.0.0.1:5432, pas par db.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Volume de développement distinct de pgdata dans la pile S3.
      # Les données ne sont pas transférées automatiquement entre ces volumes.
      - devpgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "127.0.0.1:9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - devkafkadata:/var/lib/kafka/data
  web:
    image: nginxinc/nginx-unprivileged:stable-alpine
    # Poste 127.0.0.1:8080 -> Nginx :8080 ; Nginx relaie /api vers Uvicorn :8000 du poste.
    ports:
      - "127.0.0.1:8080:8080"
    # Sur ce serveur, la passerelle de ce réseau Compose est 172.26.0.1.
    # Relever et adapter cette adresse si Docker recrée le réseau autrement.
    extra_hosts:
      # - "host.docker.internal:host-gateway"
      - "host.docker.internal:172.26.0.1"
    volumes:
      # Bind mounts en lecture seule : les modifications locales sont visibles
      # sans reconstruire l’image ; les droits Unix du poste restent à respecter.
      - ./web:/usr/share/nginx/html:ro
      - ./web/dev.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  devpgdata:
  devkafkadata:
